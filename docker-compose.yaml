services:
  portal:
    # platform: linux/amd64
    build:
      context: .
      ssh:
        - default
      dockerfile: Dockerfile
    image: portal:latest
    container_name: portal
    pull_policy: always
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - portal-net

  database:
    image: timescale/timescaledb:latest-pg15
    container_name: portal-database
    restart: unless-stopped
    environment:
      PGUSER: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${APP_DATABASE__PASSWORD}"
      POSTGRES_DB: portal
      PGPORT: 5432
    ports:
      - "5432:5432"
    volumes:
      - "portal_database:/var/lib/postgresql/data"
    networks:
      - portal-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  portal-net:
    driver: bridge

volumes:
  portal_database: