services:
  platform:
    # platform: linux/amd64
    build:
      context: .
      ssh:
        - default
      dockerfile: Dockerfile
    image: platform:latest
    container_name: platform
    pull_policy: always
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - platform-net

  database:
    image: timescale/timescaledb:latest-pg15
    container_name: platform-database
    restart: unless-stopped
    environment:
      PGUSER: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${APP_DATABASE__PASSWORD}"
      POSTGRES_DB: platform
      PGPORT: 5432
    ports:
      - "5432:5432"
    volumes:
      - "platform_database:/var/lib/postgresql/data"
    networks:
      - platform-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  platform:
    driver: bridge

volumes:
  platform_database: