[package]
name = "platform"
version = "0.1.0"
edition = "2024"
authors = ["Provably Technologies"]
description = "Platform application"
homepage = "https://provably.ai/"
repository = "https://github.com/ProvablyAI/platform"
license = "Apache-2.0"
rust-version = "1.97"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "request-id", "util"] }

# Util
anyhow = "1.0"
dotenv = "0.15"
config = "0.15"
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde-aux = "4.7"

# Logs
tracing = "0.1"
tracing-bunyan-formatter = "0.3"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }

# Database
toasty = "0.8.0"


[lints.rust]
warnings = "deny"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
