[package]
name = "platform"
version = "0.1.0"
edition = "2024"
authors = ["Provably Technologies"]
description = "Platform application"
homepage = "https://provably.ai/"
repository = "https://github.com/ProvablyAI/platform"
license = "Apache-2.0"
rust-version = "1.97"

default-run = "platform"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-health = "0.2"
axum-login = "0.18.0"
tokio = { version = "1.53", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = [
    "trace",
    "timeout",
    "request-id",
    "util",
] }
tower-sessions = { version = "0.14", features = ["signed"] }
# tower-sessions-toasty-store = "0.1"

# Mailer
lettre = { version = "0.11", features = [
    "serde",
    "pool",
    "tracing",
    "builder",
    "tokio1",
    "tokio1-native-tls",
] }
askama = "0.12"

# Validation
validator = { version = "0.20.0", features = ["derive"] }
axum-valid = { version = "0.25", features = ["full_validify"] }
validify = "2.0.0"

# Util
anyhow = "1.0"
axum-anyhow = "0.10"
dotenv = "0.15"
config = "0.15"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde-aux = "4.7"
async-trait = "0.1"
thiserror = "2.0"
serde_json = "1.0"

# Logs
tracing = "0.1"
tracing-bunyan-formatter = "0.3"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }

# Database
toasty = { version = "0.8", features = ["postgresql", "serde", "jiff"] }
toasty-cli = "0.8"
uuid = { version = "1.24", features = ["v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }

# Crypto
ed25519-dalek = { version = "3.0", features = ["pem"] }
crypto_box = { version = "0.9", features = ["chacha20", "seal", "serde"] }
spki = { version = "0.8", features = ["pem"] }
base64 = "0.22"
password-auth = "1.0.0"

# Utoipa
utoipa = { version = "5.5", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[lints.rust]
warnings = "deny"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
